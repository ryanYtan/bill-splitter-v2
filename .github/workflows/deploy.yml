# Builds the app and deploys it to https://anmitsu.dev/a/billsplit (S3 behind CloudFront)
name: Deploy to anmitsu.dev

on:
  # Runs on pushes targeting the default branch
  push:
    branches: ['master']

  # Allows you to run this workflow manually from the Actions tab
  workflow_dispatch:

# id-token lets the job exchange its GitHub OIDC token for short-lived AWS credentials (no stored secrets)
permissions:
  contents: read
  id-token: write

# Allow one concurrent deployment
concurrency:
  group: 'deploy'
  cancel-in-progress: true

env:
  AWS_REGION: ap-southeast-1
  S3_URI: s3://anmitsu-dev-frontend/a/billsplit
  # Repository variables (Settings -> Secrets and variables -> Actions -> Variables). The role is only assumable by
  # this repo's master branch, and only allowed to write under S3_URI and invalidate the distribution.
  AWS_ROLE_ARN: ${{ vars.AWS_ROLE_ARN }}
  CLOUDFRONT_DISTRIBUTION_ID: ${{ vars.CLOUDFRONT_DISTRIBUTION_ID }}

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: 'yarn'
      - name: Install dependencies
        run: yarn install --frozen-lockfile
      - name: Test
        run: yarn test
      - name: Build
        run: yarn build
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ env.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}
      # Asset file names contain a content hash, so they can be cached forever; index.html must always be revalidated
      - name: Upload assets
        run: aws s3 sync dist/ "$S3_URI/" --delete --exclude index.html --cache-control "public,max-age=31536000,immutable"
      - name: Upload index.html
        run: aws s3 cp dist/index.html "$S3_URI/index.html" --cache-control "no-cache"
      - name: Invalidate CloudFront
        run: aws cloudfront create-invalidation --distribution-id "$CLOUDFRONT_DISTRIBUTION_ID" --paths "/a/billsplit*"
